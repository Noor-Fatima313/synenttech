{% extends "base.html" %}

{% block title %}Login - Notes App{% endblock %}

{% block content %}

<div class="auth-card">

    <h1>Welcome Back</h1>

    <p class="subtitle">
        Login to access your notes.
    </p>

    <form method="POST">

        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter username"
            required
        >

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p class="auth-link">
        Don't have an account?
        <a href="{{ url_for('register') }}">Register</a>
    </p>

</div>

{% endblock %}
