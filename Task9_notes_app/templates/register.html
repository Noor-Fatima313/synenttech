{% extends "base.html" %}

{% block title %}Register - Notes App{% endblock %}

{% block content %}

<div class="auth-card">

    <h1>Create Account</h1>

    <p class="subtitle">
        Create an account to start managing your notes.
    </p>

    <form method="POST">

        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter username"
            required
        >

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            minlength="6"
            required
        >

        <button type="submit">
            Register
        </button>

    </form>

    <p class="auth-link">
        Already have an account?
        <a href="{{ url_for('login') }}">Login</a>
    </p>

</div>

{% endblock %}
