{% extends "base.html" %}

{% block title %}Add Note - Notes App{% endblock %}

{% block content %}

<div class="form-card">

    <h1>Add New Note</h1>

    <form method="POST">

        <label for="title">
            Title
        </label>

        <input
            type="text"
            id="title"
            name="title"
            placeholder="Enter note title"
            required
        >

        <label for="content">
            Content
        </label>

        <textarea
            id="content"
            name="content"
            rows="10"
            placeholder="Write your note here..."
            required
        ></textarea>

        <div class="form-actions">

            <button type="submit">
                Save Note
            </button>

            <a href="{{ url_for('dashboard') }}" class="cancel-button">
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
